{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Sistema de Seleção{% endblock %}</title>
        <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}">
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon-16x16.png' %}">
        <link rel="manifest" href="{% static 'images/site.webmanifest' %}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    </head>
    <body>
        <main class="container mt-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-4">
                        <div class="card card-login shadow">
                            <div class="card-header bg-secondary text-white text-center rounded-top py-3">
                                <h4 class="mb-0"><i class="bi bi-shield-lock"></i> Sistema de Seleção</h4>
                            </div>
                            <div class="card-body p-4">
                                
                                {% if erro %}
                                <div class="alert alert-danger d-flex align-items-center" role="alert">
                                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                    <div>{{ erro }}</div>
                                </div>
                                {% endif %}

                                <form method="post">
                                    <!-- Token CSRF (Cross-Site Request Forgery) para segurança contra ataques -->
                                    {% csrf_token %}
                                    
                                    <!-- Campo Usuário (CPF) -->
                                    <div class="mb-3">
                                        <label class="form-label" for="id_cpf">Usuário</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                                            {{ form.cpf }}
                                        </div>
                                    </div>

                                    <!-- Campo Senha -->
                                    <div class="mb-3">
                                        <label class="form-label" for="id_senha">Senha</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                                            {{ form.senha }}
                                        </div>
                                    </div>

                                    <!-- Campo Perfil -->
                                    <div class="mb-4">
                                        <label class="form-label" for="id_perfil">Perfil de Acesso</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                            {{ form.perfil }}
                                        </div>
                                    </div>

                                    <!-- Botão -->
                                    <button type="submit" class="btn btn-secondary w-100 btn-login shadow-sm">
                                        <i class="bi bi-box-arrow-in-right"></i> Entrar no Sistema
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
    {% block scripts %}
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'js/masks.js' %}"></script>
    {% endblock %}
</html>
